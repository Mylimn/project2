<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商品图片提取结果</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img class="brand-icon" src="icons/icon48.png" alt="" width="40" height="40" />
        <div class="brand-text">
          <h1>商品图片提取</h1>
          <p id="page-meta" class="meta">正在读取提取结果…</p>
        </div>
      </div>
      <div class="header-stats">
        <span id="platform-badge" class="badge" hidden></span>
        <span id="total-count" class="stat">共 0 张</span>
      </div>
    </header>

    <section class="toolbar" aria-label="图片操作栏">
      <div class="toolbar-group">
        <button id="select-all" class="btn" type="button">全选</button>
        <button id="invert" class="btn" type="button">反选</button>
        <button id="clear-selection" class="btn btn-ghost" type="button">取消选择</button>
        <span id="selected-count" class="selection">已选 0 张</span>
      </div>
      <div class="toolbar-group">
        <label class="field" for="min-size">
          <span>最小尺寸</span>
          <select id="min-size">
            <option value="0">全部</option>
            <option value="100" selected>≥ 100px</option>
            <option value="300">≥ 300px</option>
            <option value="500">≥ 500px</option>
            <option value="800">≥ 800px</option>
          </select>
        </label>
        <button id="download" class="btn btn-primary" type="button" disabled>
          下载选中
        </button>
      </div>
    </section>

    <main class="content">
      <div id="empty" class="empty" hidden>
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <circle cx="8.5" cy="9.5" r="1.6" fill="currentColor" stroke="none"></circle>
          <path d="M4.5 17.5l4.6-4.6a1.5 1.5 0 0 1 2.1 0l4.8 4.8"></path>
        </svg>
        <h2>还没有可展示的图片</h2>
        <p id="empty-hint">
          请打开淘宝 / 天猫 / 京东 / 拼多多商家版的商品详情页，点击右下角「获取图片」。
        </p>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
    </main>

    <section id="progress" class="progress" hidden aria-label="下载进度">
      <div class="progress-head">
        <strong id="progress-title">正在下载</strong>
        <span id="progress-text">0 / 0</span>
        <button id="progress-close" class="icon-btn" type="button" title="收起" aria-label="收起进度面板">
          ×
        </button>
      </div>
      <div class="progress-bar"><span id="progress-fill"></span></div>
      <ul id="progress-list" class="progress-list"></ul>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="gallery.js"></script>
  </body>
</html>
